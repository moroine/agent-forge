---
forge_users_install_root: /opt/agent-forge
# Optional, from the inventory: groups the forge user is in besides
# incus-admin (it is in exactly those). forge cloud create sets [kvm] for the
# dev VM, whose tests run QEMU with KVM.
forge_users_extra_groups: []
# CLI entry point inside a release (framing spec layout, since sub-project 2).
# ansible/tests/unit/forge_users.yml checks it exists in the checkout: the
# link to it is created even when the target is missing.
forge_users_cli_entrypoint: cli/forge
# The repository root on the controller (site.yml lives in ansible/).
forge_users_repo_root: "{{ playbook_dir | dirname }}"
forge_users_nodesource_key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
forge_users_nodesource_fingerprint: 6F71F525282841EEDAF851B42F59B5F99B1BE0B4
forge_users_nodesource_uri: https://deb.nodesource.com/node_24.x
forge_users_claude_key_url: https://downloads.claude.ai/keys/claude-code.asc
forge_users_claude_fingerprint: 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
forge_users_claude_uri: https://downloads.claude.ai/claude-code/apt/stable
# nodejs from NodeSource (Node 24); claude-code for `claude auth login`;
# Ubuntu's ansible (with community.general) for `forge image build`.
# nodejs carries cli/forge's floor as its minimum: with a bare name,
# state: present would keep a Node already installed from Ubuntu (22 on
# 26.04), on which forge refuses to run. Replacing it removes Ubuntu's npm and
# what depends on it: NodeSource's nodejs conflicts with that npm and ships
# its own. ansible/tests/unit/forge_users.yml checks the floor and the
# repository's major agree.
forge_users_packages:
  - nodejs>=24
  - claude-code
  - ansible
