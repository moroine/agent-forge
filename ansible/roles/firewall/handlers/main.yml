---
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# Reload runs `nft -f /etc/nftables.conf`, which replaces agent-forge's table
# atomically and leaves every other table alone.
- name: Load the host firewall
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
