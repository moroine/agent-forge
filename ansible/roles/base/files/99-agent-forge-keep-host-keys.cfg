#cloud-config
# Installed by agent-forge (ansible/roles/base). Keep the SSH host keys when
# cloud-init sees a new instance id. Lima assigns one at every boot, and
# cloud-init would then delete and regenerate the host keys: SSH clients
# (herdr included) would refuse the host after each restart. On a cloud VM the
# instance id is stable, so this changes nothing there.
ssh_deletekeys: false
