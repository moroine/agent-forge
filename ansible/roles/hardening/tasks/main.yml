---
- name: Harden the OS with devsec.hardening.os_hardening
  ansible.builtin.import_role:
    name: devsec.hardening.os_hardening
  vars:
    sysctl_overwrite: "{{ hardening_sysctl_overwrite }}"
    # UFW is not used: the firewall role runs native nftables.
    ufw_manage_defaults: false
    os_users_without_password_ageing: "{{ hardening_users_without_password_ageing }}"
    os_ignore_users: "{{ hardening_ignore_users }}"

# apport (Ubuntu's crash reporter) writes fs.suid_dumpable=2 when it starts,
# after systemd-sysctl applied devsec's 0: without this, the setting did not
# survive a reboot (found 2026-10-17). An agent host has no use for crash
# reports, so apport is stopped and masked rather than reconfigured.
- name: Read the installed services
  ansible.builtin.service_facts:

- name: Stop and mask apport
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - apport.service
    - apport-autoreport.path
    - apport-autoreport.service
  when: item in ansible_facts.services

- name: Read fs.suid_dumpable
  ansible.builtin.command:
    cmd: sysctl -n fs.suid_dumpable
  register: hardening_suid_dumpable
  changed_when: false

# devsec's sysctl file sets it at boot; this only catches a value apport
# changed before it was masked.
- name: Put fs.suid_dumpable back to 0
  ansible.builtin.command:
    cmd: sysctl -w fs.suid_dumpable=0
  when: hardening_suid_dumpable.stdout != '0'
  changed_when: true

- name: Harden sshd with devsec.hardening.ssh_hardening
  ansible.builtin.import_role:
    name: devsec.hardening.ssh_hardening
  vars:
    ssh_server_ports: ["{{ forge_ssh_port }}"]
    ssh_allow_users: "{{ hardening_ssh_allow_users }}"
    ssh_permit_root_login: "no"
    ssh_allow_agent_forwarding: false
    ssh_server_match_user: "{{ hardening_ssh_match_user }}"
    ssh_server_match_address: "{{ hardening_ssh_match_address }}"
    # devsec does not template this one, and OpenSSH defaults it to yes.
    sshd_custom_options:
      - AllowStreamLocalForwarding no
    # Keep Ubuntu's ed25519 host key. Otherwise devsec regenerates the RSA key
    # (Ubuntu's is 3072 bits, devsec wants 4096) and clients see a new key.
    ssh_host_key_files:
      - /etc/ssh/ssh_host_ed25519_key
