---
- name: Hardening overrides
  hosts: render
  gather_facts: false
  vars:
    forge_admin_user: ubuntu
    forge_users: [{name: alice, ssh_keys: ["ssh-ed25519 AAAA alice@test"]}]
  vars_files:
    - ../../roles/hardening/vars/main.yml
  tasks:
    - name: Check the sysctl overrides
      ansible.builtin.assert:
        that:
          - hardening_sysctl_overwrite == unit_expected_sysctls
      vars:
        unit_expected_sysctls:
          net.ipv4.ip_forward: 1
          kernel.unprivileged_userns_clone: 1
          kernel.apparmor_restrict_unprivileged_userns: 0
          kernel.yama.ptrace_scope: 1

    - name: Check who may log in, and who gets agent forwarding
      ansible.builtin.assert:
        that:
          - hardening_ssh_allow_users == 'ubuntu alice'
          - "hardening_ssh_match_user == [{'user': 'alice', 'rules': ['AllowAgentForwarding yes']}]"

    # The playbook never changes the admin's sudo: devsec's password ageing
    # would make a password-holding admin's sudo demand a new password
    # after 60 days.
    - name: Check the admin is exempt from password ageing
      ansible.builtin.assert:
        that:
          - hardening_users_without_password_ageing == ['ubuntu']

    # devsec gives every account below UID_MIN a nologin shell; Lima's admin
    # has the Mac's UID (501). The admin must keep its shell.
    - name: Check the admin keeps its login shell
      ansible.builtin.assert:
        that:
          - hardening_ignore_users == ['vagrant', 'kitchen', 'ubuntu']
