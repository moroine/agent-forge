---
# Provisions the relay: the small VM that alone holds the GitHub bot's token,
# push key and signing key, and publishes the dev VM's work (contributor
# model spec, §5.4). Hardened like a forge host, with no Incus and no forge
# user.
# `forge cloud create` runs it after contributor.yml. By hand, from a checkout:
#   ansible-galaxy collection install -r ansible/requirements.yml
#   ansible-playbook -i relay-inventory.yml ansible/relay.yml \
#     -e forge_relay_client_key_file=<the dev VM's relay key, public half>
# The inventory sets forge_exposure and the forge_relay_* inputs (see
# roles/forge_relay/defaults/main.yml).
- name: Preflight
  hosts: all
  gather_facts: false
  tasks:
    - name: Check and normalize the inventory's variables
      ansible.builtin.import_tasks: preflight/inputs.yml
    - name: Check the controller
      ansible.builtin.import_tasks: preflight/controller.yml
    - name: Resolve the SSH port to connect to
      ansible.builtin.import_tasks: preflight/port.yml
    - name: Check the target
      ansible.builtin.import_tasks: preflight/target.yml
    - name: Check the relay's inputs
      ansible.builtin.import_role:
        name: forge_relay
        tasks_from: inputs.yml
    # The relay runs fail2ban in public mode (3 failures, a ban of a day or
    # more): a few failed attempts from the agent would ban the dev VM's
    # private address, and with it every request to the relay. Its subnet is
    # never banned; key-only auth, the Match Address block and the key's
    # from= still hold it. A fact, set after preflight/inputs.yml normalized
    # the inventory's list: a play variable would lose to that fact.
    - name: Keep the dev VM's subnet out of fail2ban's bans
      ansible.builtin.set_fact:
        forge_fail2ban_ignoreip: "{{ forge_fail2ban_ignoreip | union([forge_relay_client_cidr]) }}"

- name: Provision the relay
  hosts: all
  become: true
  gather_facts: false   # the preflight play gathered them
  # As in site.yml: forced handlers keep sshd's port and the firewall in
  # agreement even when a later task fails.
  force_handlers: true
  module_defaults:
    # A fresh cloud VM often runs apt-daily at boot and holds the dpkg lock.
    ansible.builtin.apt:
      lock_timeout: 600
  # The hardening role's defaults, set for a machine with no Incus and no
  # forge user.
  vars:
    # devsec's sysctls as they are: no container traffic to route, no user
    # namespaces to allow.
    hardening_sysctl_overwrite: {}
    # The admin, and the service's account for the dev VM's key.
    hardening_ssh_allow_users: "{{ forge_admin_user }} forge-relay"
    # No agent forwarding for anyone.
    hardening_ssh_match_user: []
    # From the dev VM's subnet, the service's account only: the dev VM cannot
    # even try the admin's. And 4 sessions per connection at most (devsec's
    # default is 10): each request is one session, the client multiplexes
    # them over one connection, and a publish holds up to 64 MiB in the
    # relay's memory. MaxSessions bounds the sessions of one connection
    # only, and sshd's MaxStartups limits only connections not yet
    # authenticated: nothing here bounds how many authenticated connections
    # the dev VM opens at once. The relay's cap on publish attempts bounds
    # how many it checks an hour, not how many it holds at once.
    hardening_ssh_match_address:
      - address: "{{ forge_relay_client_cidr }}"
        rules: ["AllowUsers forge-relay", "MaxSessions 4"]
  # Ordered import_role tasks, not a roles: section, for the handlers' order
  # (see site.yml). tests/unit/site_structure.yml pins this.
  tasks:
    - name: Base system
      ansible.builtin.import_role:
        name: base
    - name: Hardening
      ansible.builtin.import_role:
        name: hardening
    - name: Host firewall
      ansible.builtin.import_role:
        name: firewall
    - name: Fail2ban
      ansible.builtin.import_role:
        name: fail2ban
    - name: Relay service
      ansible.builtin.import_role:
        name: forge_relay
