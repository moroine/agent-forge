name: agent
description: Agent profile
config:
  environment.HOME: /home/aiuser
  limits.cpu: "8"
  limits.memory: 12GB
  # Isolation : container non privilégié. Nesting activé pour Docker rootless
  # (voir docs/superpowers/specs/2026-07-17-agent-docker-support-design.md) —
  # security.privileged reste "false", donc root dans un conteneur Docker
  # imbriqué reste un UID namespacé sans pouvoir sur l'hôte.
  security.privileged: "false"
  security.nesting: "true"
  # Active la liste de blocage seccomp de LXD pour les syscalls dangereux
  # (mount, pivot_root, clone CLONE_NEWUSER, keyctl abuse, etc.)
  security.syscalls.deny_default: "true"
  # Mappe moroine (UID/GID 1000 hôte) → aiuser (UID/GID 1001 container).
  # Les fichiers du workspace restent possédés par moroine sur l'hôte et
  # apparaissent comme aiuser dans le container. Pas besoin de shift ou de chown.
  raw.idmap: |
    uid 1000 1001
    gid 1000 1001
  # Supprime les capabilities Linux non nécessaires à un agent de développement.
  # Conservées : CHOWN, DAC_OVERRIDE, SETUID, SETGID, FOWNER, FSETID, NET_BIND_SERVICE,
  #              NET_ADMIN (systemd-resolved stub 127.0.0.53),
  #              NET_RAW (systemd-networkd DHCP client et LLDP utilisent AF_PACKET)
  # NET_RAW dans un container non privilégié = raw sockets scopés au network namespace du
  # container uniquement. Le container ne voit que son propre trafic. Les règles UFW hôte
  # empêchent déjà tout pivot vers le LAN.
  raw.lxc: |
    lxc.cap.drop = sys_module sys_rawio sys_boot sys_ptrace sys_pacct
    lxc.cap.drop = net_broadcast
    lxc.cap.drop = mac_override mac_admin
    lxc.cap.drop = bpf perfmon
    lxc.cap.drop = audit_control audit_read
    lxc.cap.drop = wake_alarm block_suspend
    lxc.cap.drop = linux_immutable lease ipc_lock ipc_owner
    lxc.cap.drop = syslog
devices:
  eth0:
    name: eth0
    network: lxdbr0
    type: nic
  root:
    path: /
    pool: default
    size: 100GB
    type: disk
  # claude-code vient de l'hôte, en lecture seule : installs versionnées +
  # symlink `current` (voir docs/superpowers/specs/2026-09-20-container-per-task-design.md §4).
  # Le shim /usr/local/bin/claude résout `current` une fois, au lancement, donc
  # une bascule de version côté hôte ne touche jamais une session en cours.
  # readonly=true : durcissement, l'agent ne peut pas modifier le CLI.
  forge-claude:
    source: /home/moroine/.local/share/agent-forge/claude
    path: /opt/forge-claude
    readonly: "true"
    type: disk
project: default
